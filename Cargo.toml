[package]
name = "epo-client"
version = "0.0.3"
edition = "2024"
publish = true
description = "Async client for the EPO Open Patent Services (OPS) v3.2 REST API: OAuth2, biblio/family/citations/search, CPC titles, CQL syntax validator."
license = "MIT"
repository = "https://github.com/drfixman/epo-client"
homepage = "https://github.com/drfixman/epo-client"
documentation = "https://docs.rs/epo-client"
readme = "README.md"
keywords = ["epo", "patents", "ops", "api-client", "cql"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = ["fuzz/"]

[lib]
name = "epo"

[dependencies]
reqwest = { version = "0.13", features = ["json", "form", "query"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
