[package]
name = "epo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[dependencies.epo]
package = "epo-client"
path = ".."

[[bin]]
name = "fuzz_epo_parse"
path = "fuzz_targets/fuzz_epo_parse.rs"
doc = false

[[bin]]
name = "fuzz_cql_validate"
path = "fuzz_targets/fuzz_cql_validate.rs"
doc = false

[workspace]
members = ["."]
